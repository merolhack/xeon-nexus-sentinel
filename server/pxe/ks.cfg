# AlmaLinux 9 Kickstart - Instalacion Desatendida Headless para HP ProLiant ML150 G6
text
skipx
firstboot --disabled
eula --agreed

lang en_US.UTF-8
keyboard us
timezone America/Mexico_City --utc

# Red automatica por DHCP en la interfaz conectada
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=xeon-nexus-sentinel

# Fuente de instalacion oficial de AlmaLinux 9 (HTTP sin SSL para evitar conflicto con reloj de BIOS 2011)
url --url="http://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/" --noverifyssl

# Contrasena de root: nexusadmin2026!
rootpw --plaintext nexusadmin2026!

# Configuracion de Firewall y SELinux (Permissive para evitar bloqueo por relabeling con reloj 2011)
firewall --enabled --service=ssh
selinux --permissive

# Particionamiento automatico en disco MBR/BIOS
bootloader --location=mbr --append="nomodeset vga=normal console=tty0 console=ttyS0,115200n8"
zerombr
clearpart --all --initlabel
autopart --type=plain

# Paquetes minimos para servidor headless
%packages
@^minimal-environment
openssh-server
openssh-clients
curl
wget
tar
rsync
pciutils
lsscsi
net-tools
chrony
%end

services --enabled="sshd,NetworkManager,chronyd"

# Post-instalacion: permitir login root por SSH y sincronizar tiempo
%post --log=/root/ks-post.log
echo "PermitRootLogin yes" >> /etc/ssh/sshd_config.d/01-permitroot.conf
systemctl enable sshd
systemctl enable chronyd
%end

# Reiniciar automaticamente al terminar la instalacion
reboot
