services:
  - type: web
    name: xeon-nexus-cloud-relay
    runtime: python
    rootDir: cloud-relay
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USER
        value: administrador
      - key: ADMIN_PASSWORD_HASH
        value: ea51164dd668d869a14e71ec9a54f1ea60df5f71e7db86fa3a7fdd79c74e9e2a
      - key: JWT_SECRET_KEY
